<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b6a4f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pixel Golf</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>

      <div id="hud" class="hidden">
        <div class="hud-top">
          <div class="hud-stats">
            <div class="pill" id="hud-hole">HOLE 1/9</div>
            <div class="pill" id="hud-par">PAR 2</div>
            <div class="pill accent" id="hud-strokes">SHOTS 0</div>
          </div>
          <div class="hud-buttons">
            <button class="icon-btn hidden" id="btn-undo" aria-label="Mulligan: watch an ad to retake your last shot">
              <svg viewBox="0 0 9 9" shape-rendering="crispEdges"><path d="M2 1h1v1H2zM1 2h1v1H1zM0 3h6v1H0zM1 4h1v1H1zM2 5h1v1H2zM6 4h1v1H6zM7 5h1v2H7zM6 7h1v1H6zM3 8h3v1H3z"/></svg>
            </button>
            <button class="icon-btn" id="btn-view" aria-label="Toggle course overview">
              <svg viewBox="0 0 9 9" shape-rendering="crispEdges"><path d="M0 4h1v1H0zM1 3h1v1H1zM1 5h1v1H1zM2 2h5v1H2zM2 6h5v1H2zM7 3h1v1H7zM7 5h1v1H7zM8 4h1v1H8zM3 4h3v1H3zM4 3h1v3H4z"/></svg>
            </button>
            <button class="icon-btn" id="btn-menu" aria-label="Pause menu">
              <svg viewBox="0 0 9 9" shape-rendering="crispEdges"><path d="M2 1h2v7H2zM5 1h2v7H5z"/></svg>
            </button>
          </div>
        </div>
        <div id="banner" class="hidden"></div>
        <div id="hint" class="hidden">DRAG BACK TO AIM<br />RELEASE TO PUTT</div>
        <div id="power" class="hidden"><div id="power-fill"></div></div>
        <button id="btn-double" class="btn ad hidden"></button>
        <button id="btn-next" class="btn big hidden">NEXT HOLE</button>
      </div>

      <div id="screen-title" class="screen">
        <div class="title-top">
          <div class="pill" id="title-streak"></div>
          <div class="pill" id="title-coins"></div>
        </div>
        <div class="title-card">
          <h1><span>PIXEL</span><span>GOLF</span></h1>
          <button id="btn-daily" class="btn big daily">
            <span class="daily-label">DAILY HOLE</span>
            <span class="daily-sub" id="daily-sub"></span>
          </button>
          <button id="btn-save-streak" class="btn ad hidden"></button>
          <button id="btn-courses" class="btn big">
            <span class="daily-label">COURSES</span>
            <span class="daily-sub" id="courses-sub"></span>
          </button>
          <div class="btn-row">
            <button id="btn-shop" class="btn ghost">PRO SHOP</button>
            <button id="btn-awards" class="btn ghost">AWARDS</button>
          </div>
        </div>
      </div>

      <div id="screen-menu" class="screen hidden">
        <div class="panel">
          <h2>PAUSED</h2>
          <button id="btn-resume" class="btn">RESUME</button>
          <button id="btn-restart" class="btn">RESTART HOLE</button>
          <button id="btn-scorecard" class="btn">SCORECARD</button>
          <button id="btn-sound" class="btn">SOUND: ON</button>
          <button id="btn-reminders" class="btn hidden">REMINDERS: OFF</button>
          <button id="btn-privacy" class="btn ghost hidden">PRIVACY OPTIONS</button>
          <button id="btn-quit" class="btn ghost">QUIT</button>
        </div>
      </div>

      <div id="screen-daily" class="screen hidden">
        <div class="panel">
          <h2 id="daily-title">DAILY #1</h2>
          <p class="daily-name" id="daily-name"></p>
          <div class="daily-score" id="daily-score"></div>
          <div class="daily-stats">
            <div><span id="daily-streak"></span><small>STREAK</small></div>
            <div><span id="daily-coins"></span><small>COINS</small></div>
          </div>
          <p class="daily-next" id="daily-next"></p>
          <button id="btn-daily-double" class="btn ad hidden"></button>
          <button id="btn-share" class="btn">SHARE RESULT</button>
          <button id="btn-remind" class="btn ghost hidden">REMIND ME TOMORROW</button>
          <button id="btn-daily-done" class="btn ghost">DONE</button>
        </div>
      </div>

      <div id="screen-courses" class="screen hidden">
        <div class="panel wide">
          <h2>COURSES</h2>
          <p class="shop-coins" id="courses-stars"></p>
          <div id="course-list"></div>
          <button id="btn-courses-close" class="btn">BACK</button>
        </div>
      </div>

      <div id="screen-awards" class="screen hidden">
        <div class="panel wide">
          <h2>AWARDS</h2>
          <p class="shop-coins" id="awards-count"></p>
          <div id="award-list"></div>
          <button id="btn-awards-close" class="btn">BACK</button>
        </div>
      </div>

      <div id="screen-shop" class="screen hidden">
        <div class="panel">
          <h2>PRO SHOP</h2>
          <p class="shop-coins" id="shop-coins"></p>
          <div class="shop-tabs">
            <button class="shop-tab active" data-tab="balls">BALLS</button>
            <button class="shop-tab" data-tab="clubs">CLUBS</button>
            <button class="shop-tab" data-tab="trails">TRAILS</button>
            <button class="shop-tab" data-tab="flags">FLAGS</button>
            <button class="shop-tab" data-tab="fx">PARTY</button>
          </div>
          <button id="btn-free-coins" class="btn ad hidden"></button>
          <div class="shop-grid" id="shop-grid"></div>
          <button id="btn-shop-close" class="btn">BACK</button>
        </div>
      </div>

      <div id="toast" class="hidden"></div>

      <div id="screen-card" class="screen hidden">
        <div class="panel">
          <h2 id="card-title">SCORECARD</h2>
          <table id="card-table"></table>
          <p id="card-summary"></p>
          <button id="btn-card-close" class="btn">BACK</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
